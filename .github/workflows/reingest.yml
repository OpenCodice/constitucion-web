name: Reingestar índice (Vectorize + KV)

# Reconstruye el índice del buscador desde el repo de datos y lo sube a
# Vectorize + KV. Se dispara:
#   - repository_dispatch: lo manda constitucion-mexicana al cambiar los datos
#   - workflow_dispatch:   a mano
#   - schedule:            red de seguridad semanal (por si se perdió un dispatch)
#
# Secrets requeridos en ESTE repo (constitucion-web):
#   OPENAI_API_KEY         embeddings
#   CLOUDFLARE_API_TOKEN   permisos: Vectorize (edit) + Workers KV Storage (edit)
#                          + Workers R2 Storage (edit)
#   CLOUDFLARE_ACCOUNT_ID  id de la cuenta

on:
  repository_dispatch:
    types: [datos-actualizados]
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1" # lunes 09:00 UTC

concurrency:
  group: reingest
  cancel-in-progress: true

permissions:
  contents: read

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  reingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de la app
        uses: actions/checkout@v5

      - name: Checkout de los datos (constitucion-mexicana)
        uses: actions/checkout@v5
        with:
          repository: OpenCodice/constitucion-mexicana
          path: constitucion-mexicana

      - name: Checkout de los datos estatales (leyes-estatales)
        uses: actions/checkout@v5
        with:
          repository: OpenCodice/leyes-estatales
          path: leyes-estatales

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar embeddings (datos → .data/)
        run: |
          npm run ingest -- \
            ./constitucion-mexicana \
            ./leyes-estatales/jalisco/constitucion \
            ./leyes-estatales/cdmx/constitucion

      - name: Subir vectores a Vectorize (upsert)
        run: npm run upload:vectors

      - name: Subir pasajes a KV
        run: npm run upload:kv

      - name: Subir los PDFs fuente a R2
        # El PDF viaja en el mismo commit que las coordenadas → siempre el par exacto.
        # Keys: cpeum.pdf (federal) + {estado}.pdf, que el Worker sirve en /pdf/.
        run: |
          npx wrangler r2 object put constitucion-pdf/cpeum.pdf \
            --file ./constitucion-mexicana/fuente/CPEUM.pdf \
            --content-type application/pdf --remote
          npx wrangler r2 object put constitucion-pdf/jalisco.pdf \
            --file ./leyes-estatales/jalisco/constitucion/fuente/constitucion.pdf \
            --content-type application/pdf --remote
          npx wrangler r2 object put constitucion-pdf/cdmx.pdf \
            --file ./leyes-estatales/cdmx/constitucion/fuente/constitucion.pdf \
            --content-type application/pdf --remote
