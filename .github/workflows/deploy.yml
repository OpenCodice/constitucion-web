name: Deploy a producción

# Despliega el sitio estático (public/) y su Worker mínimo en cada push a main.
# También cada tres horas, para que las páginas (que se generan aquí desde los repos
# de datos) se mantengan al día sin commits; no más seguido porque el repo es
# privado y cada corrida consume minutos de Actions.
#
# Secrets requeridos (en este repo):
#   CLOUDFLARE_API_TOKEN   permisos "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID  id de la cuenta

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 */3 * * *"

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Lee los repos públicos de OpenCodice; si alguno no responde, la página
      # lo dice y el despliegue sigue.
      - name: Generar el inicio, /leyes y /estado
        run: npm run paginas
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Deploy (Worker + assets)
        run: npx wrangler deploy
