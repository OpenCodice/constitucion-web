name: Deploy a producción

# Despliega el sitio estático (public/) y su Worker mínimo en cada push a main.
# Las páginas se generan aquí desde los repos de datos y las corridas de
# vigilancia, así que también se despliega cuando una vigilancia termina
# (`repository_dispatch` datos-actualizados, que mandan los extractores). No hay
# despliegue por horario: todo lo que muestran las páginas cambia con un push o
# con una vigilancia, y el cron de GitHub casi no dispara.
#
# Secrets requeridos (en este repo):
#   CLOUDFLARE_API_TOKEN   permisos "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID  id de la cuenta

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [datos-actualizados]

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Tarda de 1.5 a 3 minutos; sin tarjetas en caché, medio minuto más.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      # El aviso sale del último paso de la vigilancia: se le da un momento para
      # que su corrida conste como terminada y /estado no la muestre en curso.
      - name: Esperar a que termine la vigilancia que avisó
        if: github.event_name == 'repository_dispatch'
        run: sleep 60

      - name: Instalar dependencias
        run: npm ci

      # Las tarjetas para redes (public/og/) se nombran por su contenido: con
      # las de la corrida anterior solo se dibujan las nuevas.
      - name: Recuperar las tarjetas ya dibujadas
        uses: actions/cache@v4
        with:
          path: .tarjetas
          key: tarjetas-${{ github.run_id }}
          restore-keys: tarjetas-

      # Lee los repos públicos de OpenCodice (la API y, para la bitácora, un
      # clon --bare de cada repo de datos); si alguno no responde, la página
      # lo dice y el despliegue sigue. El estado del supervisor se lee igual,
      # de su repo público.
      - name: Generar el inicio, /leyes, /estado y /bitacora
        run: npm run paginas
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Deploy (Worker + assets)
        run: npx wrangler deploy
